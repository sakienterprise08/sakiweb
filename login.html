<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKI - Iniciar Sesión / Registro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-saki" aria-label="Navegación principal">
      <div class="container-fluid navbar-saki-inner px-4 py-2">
        <a class="navbar-brand navbar-saki-brand d-flex align-items-center gap-2 m-0" href="index.html" aria-label="SAKI inicio">
          <img src="imagenes/logo/Logo1.png" alt="Logo SAKI" style="height: 40px; border-radius: 8px; object-fit: contain;">
          <span>SAKI</span>
        </a>

        <!-- Botón Hamburguesa para celulares -->
        <button class="navbar-toggler navbar-saki-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar" aria-controls="collapsibleNavbar" aria-expanded="false" aria-label="Abrir navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido colapsable -->
        <div class="collapse navbar-collapse justify-content-between align-items-center" id="collapsibleNavbar">
          
          <!-- Botones de navegación principal-->
          <div class="navbar-saki-actions navbar-nav mx-lg-auto d-flex flex-row gap-2 my-2 my-lg-0">
            <a class="nav-pill active" href="index.html#inicio" aria-current="page">Huellas</a>
            <a class="nav-pill" href="index.html#mascotas">Adoptar</a>
            <a class="nav-pill" href="tienda.html">Tienda</a>
          </div>
          <!-- Barra de busqueda-->
          <div class="d-flex mx-lg-4 my-2 my-lg-0 flex-grow-1 justify-content-center">
            <form class="w-100" style="max-width: 360px;" role="search">
              <input class="form-control saki-search-input" type="search" placeholder="Buscar productos, mascotas..." aria-label="Buscar">
            </form>
          </div>

          <!-- Aqui esta el carrito y el boton de iniciar sesion-->
          <div class="navbar-saki-utilities d-flex align-items-center gap-3 mt-2 mt-lg-0">
            <!-- Botón del Carrito configurado para abrir el Offcanvas -->
            <button class="saki-icon-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas" aria-label="Ver carrito de compras">
              <i class="bi bi-cart3"></i>
            </button>
            
            <!-- Botón de Iniciar Sesión por ahora lleva al dashboard, inicar sesion y registrarse aun no implementado-->
            <a class="saki-login-button" href="dashboard.html">Iniciar sesión</a>
          </div>

        </div>
      </div>
    </nav>
</header>
<div class="container py-4">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-10 col-lg-9">
            <div class="row login-card overflow-hidden shadow-lg border-0 m-0">
                
                <!-- Columna Izquierda: Imagen del perrito (Se oculta en móviles, visible en tablets/PC) -->
                <div class="col-md-6 d-none d-md-block p-0">
                    <img src="/imagenes/login.png" alt="Mascota SAKI" class="img-fluid h-100 w-100 image-cover">
                </div>

                <!-- Columna Derecha: Formulario -->
                <div class="col-12 col-md-6 p-4 p-sm-5 d-flex flex-column justify-content-center bg-card-custom">
                    
                    <!-- Logo editable (remplazar 'logo.png' por tu imagen oficial) -->
                    <div class="text-center mb-3">
                        <img src="/imagenes/logo/Logo1.png" alt="Logo SAKI" class="auth-logo mb-2" id="appLogo">
                        <h2 class="fw-bold text-brand fs-3" id="formTitle">Inicia sesión</h2>
                        <p class="text-muted small mb-0" id="formSubtitle">Para seguir cuidando a quienes te llenan de amor.</p>
                    </div>

                    <!-- Formulario de Login / Registro -->
                    <form id="authForm" onsubmit="handleAuth(event)">
                        
                        <!-- Correo Electrónico -->
                        <div class="mb-3">
                            <div class="input-group input-custom">
                                <span class="input-group-text bg-transparent border-end-0 text-muted">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0 ps-0" placeholder="Correo electrónico" required>
                            </div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <div class="input-group input-custom">
                                <span class="input-group-text bg-transparent border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="passwordInput" class="form-control border-start-0 border-end-0 ps-0" placeholder="Contraseña" required>
                                <span class="input-group-text bg-transparent border-start-0 text-muted cursor-pointer" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Campos Adicionales para REGISTRO (ocultos por defecto) -->
                        <div id="registerExtraFields" style="display: none;">
                            <!-- Repetir Contraseña -->
                            <div class="mb-3">
                                <div class="input-group input-custom">
                                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 ps-0" placeholder="Repite la contraseña">
                                </div>
                            </div>
                            <!-- Teléfono -->
                            <div class="mb-3">
                                <div class="input-group input-custom">
                                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                                        <i class="bi bi-telephone"></i>
                                    </span>
                                    <input type="tel" class="form-control border-start-0 ps-0" placeholder="Número de teléfono">
                                </div>
                            </div>
                        </div>

                        <!-- Opciones de Login (Recordarme / Olvidaste contraseña) -->
                        <div id="loginOptions" class="d-flex justify-content-between align-items-center mb-3 small">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
                            </div>
                            <a href="#" class="text-brand text-decoration-none fw-semibold">¿Olvidaste tu contraseña?</a>
                        </div>

                        <!-- Botón Principal -->
                        <button type="submit" id="submitBtn" class="btn btn-brand w-100 py-2 rounded-pill fw-bold mb-3 d-flex align-items-center justify-content-center gap-2">
                            <span>Iniciar sesión</span> <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>

                    <!-- Divisor O -->
                    <div class="d-flex align-items-center my-2">
                        <hr class="flex-grow-1 text-muted opacity-25">
                        <span class="px-2 small text-muted">o</span>
                        <hr class="flex-grow-1 text-muted opacity-25">
                    </div>

                    <!-- Botón Google -->
                    <button type="button" class="btn btn-outline-custom w-100 py-2 rounded-pill fw-medium small mb-4 d-flex align-items-center justify-content-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                        Continuar con Google
                    </button>

                    <!-- Alternar a Registro o Login -->
                    <div class="text-center small">
                        <span id="toggleText" class="text-muted">¿No tienes una cuenta?</span>
                        <a href="javascript:void(0)" id="toggleAuthBtn" class="text-brand fw-bold text-decoration-none ms-1" onclick="toggleAuthMode()">
                            Regístrate aquí →
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tu script JavaScript externo -->
<script src="login.js"></script>
</body>
</html>
